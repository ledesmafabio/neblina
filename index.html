<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neblina Mágica Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #050510; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        #word { text-shadow: 0 0 15px #0cf; font-size: 1.8em; font-weight: bold; color: #0cf; text-transform: uppercase; }
        #mic-status { font-size: 0.9em; color: #ff4444; margin-top: 10px; background: rgba(0,0,0,0.5); display: inline-block; padding: 5px 15px; border-radius: 20px; }
        
        #overlay { display: flex; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: #050510; justify-content: center; align-items: center; }
        .card { background: #111; padding: 30px; border-radius: 20px; border: 2px solid #0cf; text-align: center; width: 85%; max-width: 400px; }
        
        button { 
            padding: 18px 35px; cursor: pointer; background: #0cf; color: #000; 
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.2em;
            box-shadow: 0 10px 20px rgba(0,204,255,0.3); pointer-events: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="word">ESPERANDO VOZ</div>
        <div id="mic-status">🔴 Micrófono Apagado</div>
    </div>

    <div id="overlay">
        <div class="card">
            <h2 style="color: #0cf">MODO MÓVIL</h2>
            <p>Para activar la neblina, presiona el botón y acepta el permiso de micrófono en la ventana que aparecerá.</p>
            <button id="btnActivar">ACTIVAR AHORA</button>
        </div>
    </div>

<script>
let particles = [];
let targetPoints = [];
let isWordActive = false;
let timer = 0;
let pg;
let recognition;
let active = false;

// --- SISTEMA DE VOZ REFORZADO ---
async function activarVoz() {
    // 1. Intentar forzar el permiso de audio primero (algunos móviles lo requieren)
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Si llegamos aquí, ya tenemos permiso. Cerramos el stream para que lo use la Voice API
        stream.getTracks().forEach(track => track.stop());
    } catch (err) {
        console.error("Permiso denegado o error de hardware:", err);
        document.getElementById('mic-status').innerText = "❌ Permiso denegado";
        return;
    }

    // 2. Configurar Reconocimiento
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) {
        alert("Navegador no compatible. Usa Chrome en Android.");
        return;
    }

    recognition = new Speech();
    recognition.lang = 'es-ES';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onstart = () => {
        active = true;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('mic-status').innerText = "🟢 Escuchando...";
        document.getElementById('mic-status').style.color = "#0f0";
    };

    recognition.onresult = (e) => {
        let text = e.results[e.results.length - 1][0].transcript.trim();
        createWordPoints(text);
    };

    recognition.onend = () => { if(active) recognition.start(); };

    recognition.start();
}

function createWordPoints(txt) {
    document.getElementById('word').innerText = txt;
    targetPoints = [];
    pg.clear();
    pg.background(0);
    pg.fill(255);
    let fontSize = width / (txt.length * 0.7);
    pg.textSize(Math.min(fontSize, 120));
    pg.text(txt.toUpperCase(), pg.width/2, pg.height/2);
    pg.loadPixels();
    
    let step = width < 600 ? 7 : 5;
    for (let x = 0; x < pg.width; x += step) {
        for (let y = 0; y < pg.height; y += step) {
            let i = (x + y * pg.width) * 4;
            if (pg.pixels[i] > 128) targetPoints.push(createVector(x, y));
        }
    }
    isWordActive = true;
    timer = 150;
}

// El evento CLICK es el único que Chrome Android respeta para abrir el micro
document.getElementById('btnActivar').onclick = function() {
    activarVoz();
    if (typeof userStartAudio === 'function') userStartAudio();
};

// --- P5.JS ---
function setup() {
    createCanvas(windowWidth, windowHeight);
    pg = createGraphics(width, height);
    pg.textAlign(CENTER, CENTER);
    pg.pixelDensity(1);
    let pCount = width < 600 ? 350 : 600;
    for (let i = 0; i < pCount; i++) particles.push(new Particle());
}

function draw() {
    background(5, 5, 20, 60);
    if (timer > 0) { timer--; if (timer <= 0) isWordActive = false; }
    for (let i = 0; i < particles.length; i++) {
        if (isWordActive && targetPoints.length > 0) {
            particles[i].follow(targetPoints[i % targetPoints.length]);
        } else {
            particles[i].wander();
        }
        particles[i].update();
        particles[i].show();
    }
}

class Particle {
    constructor() {
        this.pos = createVector(random(width), random(height));
        this.vel = p5.Vector.random2D();
        this.acc = createVector();
        this.maxS = 7;
        this.maxF = 0.5;
        this.c = color(random(100,255), random(150,255), 255, 180);
    }
    follow(t) {
        let d = p5.Vector.sub(t, this.pos);
        let dist = d.mag();
        d.setMag(dist < 80 ? map(dist, 0, 80, 0, this.maxS) : this.maxS);
        let s = p5.Vector.sub(d, this.vel).limit(this.maxF);
        this.acc.add(s);
    }
    wander() {
        let n = noise(this.pos.x*0.01, this.pos.y*0.01, frameCount*0.01);
        this.acc.add(p5.Vector.fromAngle(n * TWO_PI * 2).mult(0.15));
        if (this.pos.x < 0) this.pos.x = width; if (this.pos.x > width) this.pos.x = 0;
        if (this.pos.y < 0) this.pos.y = height; if (this.pos.y > height) this.pos.y = 0;
    }
    update() {
        this.vel.add(this.acc).limit(this.maxS);
        this.pos.add(this.vel);
        this.acc.mult(0);
        if (frameCount % 40 == 0) this.c = color(random(150,255), random(150,255), 255, 180);
    }
    show() {
        stroke(this.c);
        strokeWeight(width < 600 ? 2 : 3);
        point(this.pos.x, this.pos.y);
    }
}
</script>
</body>
</html>
